<body>
    <div id='splash-logo'>

<canvas id="canvas"></canvas>
<div id="error">WebGL2 not supported</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const canvas = document.getElementById('canvas');
const errorDiv = document.getElementById('error');

// Try to create WebGL2 renderer
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ 
    canvas, 
    context: canvas.getContext('webgl2'),
    antialias: false 
  });
  if (!renderer.capabilities.isWebGL2) {
    throw new Error('WebGL2 not available');
  }
} catch (e) {
  console.error('WebGL2 initialization failed:', e);
  errorDiv.style.display = 'block';
  throw e;
}

// Performance settings
const maxDpr = 2;               // Clamp DPR for performance (1 = standard, 2 = retina)
let renderScale = 0.5;          // Render resolution scale (mutable, adjusted by controller)

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxDpr));

// Scene and camera
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// Vertex shader (GLSL 300)
const vertexShader = `
out vec2 vUv;

void main() {
  vUv = uv;
  gl_Position = vec4(position, 1.0);
}`;

// Fragment shader (GLSL 300)
// "Whirl" by @XorDev - https://www.shadertoy.com/view/XXVfzd
const fragmentShader = `
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform float t;       // time in seconds
uniform vec2 r;        // resolution (pixels)
uniform float steps;   // dynamic raymarch steps (float, used as int)

// constants from the shadertoy snippet
#define COL_FREQ 1.0
#define RGB_SHIFT vec3(0., 1., 2.)
#define OPACITY 0.1
#define PERSPECTIVE 1.0
#define Z_SPEED 0.7

uniform float twist;

// maximum loop iterations (compile-time upper bound)
const int MAX_STEPS = 200;

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 res = r.xy;
    vec2 uv = (2.0 * fragCoord - res) / res.y;
    vec3 dir = normalize(vec3(uv, -PERSPECTIVE));
    vec3 col = vec3(0.0);
    float z = 0.0;
    float d = 0.0;

    // dynamicSteps: safe integer from uniform steps
    int dynamicSteps = int(clamp(floor(steps + 0.5), 1.0, float(MAX_STEPS)));

    for (int i = 0; i < MAX_STEPS; ++i) {
        if (i >= dynamicSteps) break;

        vec3 p = z * dir;
        p.z -= Z_SPEED * t;
        float angle = p.z * twist;
        p.xy *= mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
        vec3 v = cos(p + sin(p.yzx / 0.3));
        d = length(max(v, v.zxy * OPACITY)) / 6.0;
        z += d;
        // accumulate color with glow attenuation
        col += (cos(COL_FREQ * p.z + RGB_SHIFT) + 1.0) / d;
    }

    // exponential tonemapping (scaled by steps)
    col = 1.0 - exp(-col / float(dynamicSteps) / 5e1);
    fragColor = vec4(col, 1.0);
}

void main() {
  vec2 fragCoord = vUv * r;
  mainImage(fragColor, fragCoord);
}`;

// Create shader material
const material = new THREE.ShaderMaterial({
  uniforms: { 
    t: { value: 0 },
    steps: { value: 100.0 },  // dynamic raymarch steps (adjusted by controller)
    r: { value: new THREE.Vector2() },
    twist: { value: 0.5 }      // dynamic twist value (varies between 0.1 and 0.9)
  },
  vertexShader,
  fragmentShader,
  glslVersion: THREE.GLSL3
});

// Create fullscreen plane
const geometry = new THREE.PlaneGeometry(2, 2);
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// Handle resize
function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  // Calculate scaled render buffer size
  const renderWidth = Math.max(1, Math.floor(width * renderScale));
  const renderHeight = Math.max(1, Math.floor(height * renderScale));
  
  // Set internal drawing buffer to scaled size, but don't update CSS size yet
  renderer.setSize(renderWidth, renderHeight, false);
  
  // Manually set canvas CSS to full window size
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  
  // Update resolution uniform with actual render buffer size in device pixels
  const dpr = renderer.getPixelRatio();
  material.uniforms.r.value.set(renderWidth * dpr, renderHeight * dpr);
}
window.addEventListener('resize', resize);
resize();

// Adaptive resolution controller (proportional control, 1s interval)
const targetFPS = 60;
const minScale = 0.3;
const maxScale = 1.0;
const Kp = 0.002;           // proportional gain for renderScale (tweakable)
const applyAlpha = 0.15;    // smoothing applied when updating renderScale
const epsilon = 0.01;       // minimal change to apply resize
const controllerIntervalMs = 1000;

// Adaptive steps controller parameters
const minSteps = 20;
const maxSteps = 120;
let currentSteps = 100.0;   // mutable, adjusted by controller
const Kp_steps = 0.6;       // proportional gain for steps (tweakable)
const applyAlpha_steps = 0.18;  // smoothing for steps
const epsilon_steps = 1.0;  // minimal step change to apply

// EMA for FPS
let fpsEMA = targetFPS;
let lastFrameTime = performance.now();

function updateFpsEstimate(now) {
  const instantDelta = now - lastFrameTime;
  lastFrameTime = now;
  if (instantDelta <= 0) return;
  const instantFps = 1000 / instantDelta;
  // smooth factor for EMA: gives more weight to recent FPS, tweak if needed
  const fpsAlpha = 0.08;
  fpsEMA = fpsEMA * (1.0 - fpsAlpha) + instantFps * fpsAlpha;
}

// Controller tick: run once per second
function controllerTick() {
  const measured = fpsEMA;
  const error = measured - targetFPS;     // positive when we have spare capacity
  
  // Adjust renderScale
  const delta = Kp * error;
  let candidate = renderScale + delta;
  candidate = Math.max(minScale, Math.min(maxScale, candidate));
  const newScale = renderScale * (1.0 - applyAlpha) + candidate * applyAlpha;
  
  // Adjust raymarch steps
  const deltaSteps = Kp_steps * error;
  let candidateSteps = currentSteps + deltaSteps;
  candidateSteps = Math.max(minSteps, Math.min(maxSteps, candidateSteps));
  const newSteps = currentSteps * (1.0 - applyAlpha_steps) + candidateSteps * applyAlpha_steps;
  
  // Apply renderScale change if meaningful
  if (Math.abs(newScale - renderScale) > epsilon) {
    renderScale = newScale;
    resize();
    console.log(`Adaptive renderScale -> ${renderScale.toFixed(3)} (FPS ${measured.toFixed(1)})`);
  }
  
  // Apply steps change if meaningful
  if (Math.abs(newSteps - currentSteps) >= epsilon_steps) {
    currentSteps = newSteps;
    material.uniforms.steps.value = currentSteps;
    console.log(`Adaptive steps -> ${Math.round(currentSteps)} (FPS ${measured.toFixed(1)})`);
  }
}

// Start controller interval
const controllerId = setInterval(controllerTick, controllerIntervalMs);

// Animation loop
function animate(time) {
  const seconds = time * 0.001; // Convert to seconds
  material.uniforms.t.value = seconds;
  
  // Vary twist between 0.1 and 0.9 over 9 seconds using sine wave
  // Formula: 0.5 + 0.4 * sin(2π * t / 9) gives range [0.1, 0.9]
  material.uniforms.twist.value = 0.5 + 0.4 * Math.sin((seconds * 2.0 * Math.PI) / 9.0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(animateWithFps);
}

// Wrapper to update FPS estimate each frame
function animateWithFps(time) {
  updateFpsEstimate(time);
  animate(time);
}

requestAnimationFrame(animateWithFps);
</script>
</body>
